<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Named greys from the LGrow palette card" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:150px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div class="g">
<div class="sw" style="background:var(--african-turquoise);color:#fff"><div class="nm">African Turquoise</div><div class="hx">#000000</div><div class="hx" style="opacity:.5">--n-0</div></div>
<div class="sw" style="background:var(--solid-black);color:#fff"><div class="nm">Solid Black</div><div class="hx">#0C0C0C</div><div class="hx" style="opacity:.5">--n-1</div></div>
<div class="sw" style="background:var(--refresh-black);color:#fff"><div class="nm">Refresh Black</div><div class="hx">#121212</div><div class="hx" style="opacity:.5">--n-2</div></div>
<div class="sw" style="background:var(--electric-black);color:#fff"><div class="nm">Electric Black</div><div class="hx">#292929</div><div class="hx" style="opacity:.5">--n-4</div></div>
<div class="sw" style="background:var(--boulder);color:#fff"><div class="nm">Boulder</div><div class="hx">#78787B</div><div class="hx" style="opacity:.5">--n-6</div></div>
<div class="sw" style="background:var(--chinese-silver);color:#0C0C0C"><div class="nm">Chinese Silver</div><div class="hx">#C2C2C2</div><div class="hx" style="opacity:.5">--n-8</div></div>
<div class="sw" style="background:var(--full-white);color:#0C0C0C"><div class="nm">Full White</div><div class="hx">#FFFFFF</div><div class="hx" style="opacity:.5">--n-9</div></div>
</div></body></html>
