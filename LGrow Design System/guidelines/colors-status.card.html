<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Deltas, alerts and destructive actions" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:150px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div class="g">
<div class="sw" style="background:var(--success);color:#0C0C0C"><div class="nm">Success</div><div class="hx">#2BD07A</div><div class="hx" style="opacity:.5">--success</div></div>
<div class="sw" style="background:var(--success-bg);color:#2BD07A"><div class="nm">Success bg</div><div class="hx">#12331F</div><div class="hx" style="opacity:.5">--success-bg</div></div>
<div class="sw" style="background:var(--danger);color:#0C0C0C"><div class="nm">Danger</div><div class="hx">#FF3B4E</div><div class="hx" style="opacity:.5">--danger</div></div>
<div class="sw" style="background:var(--danger-bg);color:#FF3B4E"><div class="nm">Danger bg</div><div class="hx">#3A0F17</div><div class="hx" style="opacity:.5">--danger-bg</div></div>
<div class="sw" style="background:var(--warning);color:#0C0C0C"><div class="nm">Warning</div><div class="hx">#FFC93C</div><div class="hx" style="opacity:.5">--warning</div></div>
</div></body></html>
