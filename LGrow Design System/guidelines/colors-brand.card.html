<!-- @dsCard group="Colors" viewport="700x150" name="Blue Glow" subtitle="The single brand colour — every accent, arc, glow and link" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:150px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div class="g">
<div class="sw" style="background:var(--blue-glow);color:#fff"><div class="nm">Blue Glow</div><div class="hx">#4B45F4</div><div class="hx" style="opacity:.5">--blue-glow</div></div>
<div class="sw" style="background:var(--blue-600);color:#fff"><div class="nm">Pressed</div><div class="hx">#3B35DC</div><div class="hx" style="opacity:.5">--blue-600</div></div>
<div class="sw" style="background:var(--blue-300);color:#0C0C0C"><div class="nm">Tint 300</div><div class="hx">#A49FF8</div><div class="hx" style="opacity:.5">--blue-300</div></div>
<div class="sw" style="background:var(--blue-100);color:#0C0C0C"><div class="nm">Tint 100</div><div class="hx">#E3E1FE</div><div class="hx" style="opacity:.5">--blue-100</div></div>
<div class="sw" style="background:var(--n-1);border:var(--border-card);box-shadow:var(--glow-soft)"><div class="nm">Glow soft</div><div class="hx">--glow-soft</div></div>
</div></body></html>
