<!-- @dsCard group="Brand" viewport="700x200" name="Blue cone light" subtitle="The signature background motif — a spotlight cone from the edge" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:200px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div class="g">
<div class="sw" style="background:var(--surface-page);position:relative;overflow:hidden;border:var(--border-card)"><div style="position:absolute;inset:0;background:var(--bg-cone-up)"></div><div class="nm" style="position:relative">--bg-cone-up</div></div>
<div class="sw" style="background:var(--surface-page);position:relative;overflow:hidden;border:var(--border-card)"><div style="position:absolute;inset:0;background:var(--bg-cone-down)"></div><div class="nm" style="position:relative;align-self:flex-start">--bg-cone-down</div></div>
<div class="sw" style="background:var(--bg-panel-violet);color:#0C0C0C"><div class="nm">--bg-panel-violet</div><div class="hx">marketing panels only</div></div>
</div></body></html>
