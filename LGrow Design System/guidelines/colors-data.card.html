<!-- @dsCard group="Colors" viewport="700x150" name="Metric colours" subtitle="Daily Process contributions — never used for UI chrome" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:150px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div class="g">
<div class="sw" style="background:var(--data-calories);color:#0C0C0C"><div class="nm">Calories Burned</div><div class="hx">#9B93F5</div><div class="hx" style="opacity:.5">--data-calories</div></div>
<div class="sw" style="background:var(--data-nutrition);color:#0C0C0C"><div class="nm">Nutrition</div><div class="hx">#FF7A18</div><div class="hx" style="opacity:.5">--data-nutrition</div></div>
<div class="sw" style="background:var(--data-exercises);color:#0C0C0C"><div class="nm">Exercises</div><div class="hx">#FF2D7E</div><div class="hx" style="opacity:.5">--data-exercises</div></div>
<div class="sw" style="background:var(--data-steps);color:#0C0C0C"><div class="nm">Steps</div><div class="hx">#FFC93C</div><div class="hx" style="opacity:.5">--data-steps</div></div>
</div></body></html>
