<!-- @dsCard group="Brand" viewport="700x150" name="Borders & elevation" subtitle="Hairlines separate; shadows only float" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:150px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div class="g">
<div class="sw" style="background:var(--surface-card);border:var(--border-card);justify-content:center;align-items:center"><div class="hx">--border-card · white 8%</div></div>
<div class="sw" style="background:var(--surface-card);border:var(--border-strong);justify-content:center;align-items:center"><div class="hx">--border-strong · white 16%</div></div>
<div class="sw" style="background:var(--surface-card);box-shadow:var(--shadow-sheet);justify-content:center;align-items:center"><div class="hx">--shadow-sheet</div></div>
<div class="sw" style="background:var(--surface-glass);border:1px solid var(--line-hairline);box-shadow:var(--shadow-tabbar);justify-content:center;align-items:center"><div class="hx">--shadow-tabbar</div></div>
</div></body></html>
