<!-- @dsCard group="Colors" viewport="700x150" name="Sleep stages" subtitle="Sleep gauge and month chart stage colours" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:150px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div class="g">
<div class="sw" style="background:var(--sleep-rem);color:#0C0C0C"><div class="nm">REM</div><div class="hx">#FF2D7E</div><div class="hx" style="opacity:.5">--sleep-rem</div></div>
<div class="sw" style="background:var(--sleep-deep);color:#0C0C0C"><div class="nm">Deep</div><div class="hx">#8B85F0</div><div class="hx" style="opacity:.5">--sleep-deep</div></div>
<div class="sw" style="background:var(--sleep-core);color:#0C0C0C"><div class="nm">Core</div><div class="hx">#22C1E0</div><div class="hx" style="opacity:.5">--sleep-core</div></div>
<div class="sw" style="background:var(--sleep-awake);color:#0C0C0C"><div class="nm">Awake</div><div class="hx">#FFC93C</div><div class="hx" style="opacity:.5">--sleep-awake</div></div>
<div class="sw" style="background:var(--sleep-inbed);color:#0C0C0C"><div class="nm">In bed</div><div class="hx">#9A9A9E</div><div class="hx" style="opacity:.5">--sleep-inbed</div></div>
<div class="sw" style="background:var(--sleep-asleep);color:#0C0C0C"><div class="nm">Asleep</div><div class="hx">#F0518E</div><div class="hx" style="opacity:.5">--sleep-asleep</div></div>
</div></body></html>
