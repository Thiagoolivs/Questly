<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:170px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div style="display:flex;flex-direction:column;gap:6px">
<div style="font-size:var(--fs-display);font-weight:var(--fw-semibold);letter-spacing:var(--ls-display);line-height:var(--lh-tight)">Welcome to Our Zone</div>
<div class="tk">--fs-display 30 / 600 / -0.02em</div>
<div style="font-size:var(--fs-title-1);font-weight:var(--fw-semibold);letter-spacing:var(--ls-title)">Check Your Phone Number</div>
<div class="tk">--fs-title-1 24 / 600</div>
<div style="font-size:var(--fs-title-2);font-weight:var(--fw-semibold)">Ready to workout?</div>
<div class="tk">--fs-title-2 20 / 600</div>
</div></body></html>
