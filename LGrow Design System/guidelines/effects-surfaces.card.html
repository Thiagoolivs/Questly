<!-- @dsCard group="Brand" viewport="700x180" name="Card treatments" subtitle="Hairline, bloom, glass, inverse" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui);height:180px;box-sizing:border-box;padding:16px;overflow:hidden}
.g{display:flex;gap:10px;align-items:stretch;height:100%}
.sw{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:2px}
.nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
.tk{font-size:10px;color:var(--text-tertiary);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:14px}
</style></head><body><div class="g">
<div class="sw" style="background:var(--surface-card);border:var(--border-card);justify-content:flex-end"><div class="nm">Card</div><div class="hx">#121212 + white 8% hairline</div></div>
<div class="sw" style="background:var(--surface-card);border:var(--border-card);position:relative;overflow:hidden;justify-content:flex-end"><div style="position:absolute;inset:0;background:var(--bg-card-bloom)"></div><div class="nm" style="position:relative">Bloom</div><div class="hx" style="position:relative">--bg-card-bloom</div></div>
<div class="sw" style="background:var(--surface-glass);border:1px solid var(--line-strong);backdrop-filter:var(--blur-glass);justify-content:flex-end"><div class="nm">Glass</div><div class="hx">#292929 72% + blur 18</div></div>
<div class="sw" style="background:var(--surface-inverse);color:var(--text-on-light);justify-content:flex-end"><div class="nm">Inverse</div><div class="hx">Full White · CTAs, active states</div></div>
</div></body></html>
