<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>LGrow — Mobile UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:#050505}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 0;font-family:var(--font-ui);color:var(--text-primary)}
#root{display:flex;flex-direction:column;align-items:center;gap:18px}
::-webkit-scrollbar{width:0;height:0}
.flowbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.flowbar button{height:26px;padding:0 11px;border-radius:999px;border:1px solid var(--line-hairline);background:var(--surface-chip);color:var(--text-secondary);font-family:var(--font-ui);font-size:11px;cursor:pointer}
.flowbar button[data-on="1"]{background:var(--full-white);color:#000;border-color:transparent}
</style></head><body><div id="root"></div>
<script type="text/babel" src="PhoneShell.jsx"></script>
<script type="text/babel" src="AuthFlow.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ExerciseScreen.jsx"></script>
<script type="text/babel" src="CoachingScreen.jsx"></script>
<script type="text/babel" src="ScanScreen.jsx"></script>
<script type="text/babel" src="SleepScreen.jsx"></script>
<script type="text/babel" src="ChatScreens.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>
<script type="text/babel">
const ROUTES = [
  ["onboarding","Onboarding"],["login","Login"],["otp","OTP"],["info","Basic info"],["device","Connect device"],
  ["home","Home"],["exercise","Exercise"],["coaching","Coaching"],["scan","AI scan"],["chats","Chats"],["thread","Chat"],["profile","Profile"],["sleep","Sleep"]
];
const TAB_OF = { home:"home", exercise:"home", coaching:"coaching", scan:"coaching", chats:"chats", thread:"chats", profile:"profile", sleep:"profile" };

function App(){
  const [route,setRoute] = React.useState("onboarding");
  const go = (r) => setRoute(r);
  const chrome = !!TAB_OF[route];
  const showTabs = ["home","coaching","chats","profile"].includes(route);
  const content = {
    onboarding: <OnboardingScreen onNext={()=>go("login")} />,
    login: <LoginScreen onNext={()=>go("otp")} />,
    otp: <OtpScreen onNext={()=>go("info")} onClose={()=>go("login")} />,
    info: <BasicInfoScreen onNext={()=>go("device")} />,
    device: <ConnectDeviceScreen onNext={()=>go("home")} />,
    home: <HomeScreen onOpenExercise={()=>go("exercise")} />,
    exercise: <ExerciseScreen onBack={()=>go("home")} />,
    coaching: <CoachingScreen onOpenExercise={()=>go("exercise")} onScan={()=>go("scan")} />,
    scan: <ScanScreen onBack={()=>go("coaching")} />,
    chats: <ChatsScreen onOpenThread={()=>go("thread")} />,
    thread: <ChatThreadScreen onBack={()=>go("chats")} />,
    profile: <ProfileScreen onOpenSleep={()=>go("sleep")} />,
    sleep: <SleepScreen onBack={()=>go("profile")} />,
  }[route];
  return (<React.Fragment>
    <PhoneShell tab={TAB_OF[route]} onTab={go} showTabs={showTabs} scroll={!["onboarding","login","otp","exercise","thread","device"].includes(route)}>
      {content}
    </PhoneShell>
    <div className="flowbar">
      {ROUTES.map(([id,label])=> <button key={id} data-on={route===id?"1":"0"} onClick={()=>go(id)}>{label}</button>)}
    </div>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
