name: CI

# Os 87 testes e as varreduras só rodavam quando alguém lembrava. Duas rodadas
# de correção seguidas foram gastas com erro que qualquer uma delas pegaria.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # As mesmas dependências do Dockerfile: se quebrar aqui, quebra em produção.
      - run: pip install --no-cache-dir -r backend/requirements.txt
      - run: python -m pytest tests/ -q
        working-directory: backend

  frontend:
    name: Build e props do design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Prop desconhecida cai no `...rest` e some sem erro: foi assim que
      # metade das telas ficou sem botão. O build não vê, esta varredura vê.
      - run: npm run verify:props
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  interface:
    name: Varredura das telas no Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install --no-cache-dir -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # O backend serve o dist do frontend, então a varredura vê o app inteiro
      # como ele chega ao telefone — não o servidor de desenvolvimento.
      - run: npm run build
        working-directory: frontend
      - name: Subir o app
        run: |
          QUESTLY_DB="${RUNNER_TEMP}/questly-ci.db" \
          FRONTEND_DIST="${GITHUB_WORKSPACE}/frontend/dist" \
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8099 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/api/health && break
            sleep 1
          done
        working-directory: backend

      # Erro de console, tela em branco, emoji fora do feed e do chat, e
      # vazamento horizontal em 390px — nas 18 rotas.
      - run: npm run verify:ui
        working-directory: frontend
